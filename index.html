<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Gallery</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        h1 {
            margin-bottom: 25px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 900px;
            margin: auto;
        }

        img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }

        .creator {
            margin-top: 35px;
            padding-top: 20px;
            border-top: 1px solid #333;
            color: #aaa;
            font-size: 15px;
        }

        .creator strong {
            color: white;
        }
    </style>
</head>

<body>

<h1>Reality of A.G.L😈</h1>

<div class="gallery">

    <img src="photo1.jpg">
    <img src="photo2.jpg">
    <img src="photo3.jpg">
    <img src="photo4.jpg">
    <img src="photo5.jpg">
    <img src="photo6.jpg">
    <img src="photo7.jpg">
    <img src="photo8.jpg">
    <img src="photo9.jpg">
    <img src="photo10.jpg">

</div>

<div class="creator">
    Created by <strong>Priyanshu Ghosh</strong>
</div>

</body>
</html>
